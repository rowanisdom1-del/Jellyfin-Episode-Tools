name: Build plugin

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Install the .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build and Package Plugin
        run: |
          set -euo pipefail
          
          # 1. Dynamically locate the C# project file anywhere in the repository
          PROJECT=$(find . -maxdepth 4 -type f -name "*.csproj" | head -n1)
          if [ -z "$PROJECT" ]; then
            echo "Error: No .csproj file could be found in the repository."
            exit 1
          fi
          echo "Found project: $PROJECT"
          
          # 2. Compile the binary asset
          dotnet build "$PROJECT" -c Release -o out
          
          # 3. Extract version metadata and package assembly context dynamically
          VERSION=$(grep -oP '(?<=<Version>)[^<]+' "$PROJECT" || echo "1.0.0.0")
          ASSEMBLY=$(basename "$PROJECT" .csproj)
          PKG="EpisodeTools_${VERSION}"
          
          echo "Packaging: $PKG (Assembly: $ASSEMBLY)"
          mkdir -p "$PKG"
          cp "out/${ASSEMBLY}.dll" "$PKG/"
          
          # 4. Generate deployment manifest JSON mapping structure
          cat > "$PKG/meta.json" <<EOF
          {
            "category": "General",
            "changelog": "Version ${VERSION}",
            "description": "Scheduled tasks to rename episodes to Show - S01E02 - Title and to convert MKV to MP4 without quality loss.",
            "guid": "059e3874-fa20-4af9-af24-8d26823840d9",
            "name": "Episode Tools",
            "overview": "Rename episodes and convert MKV to MP4 from Scheduled Tasks",
            "owner": "${GITHUB_REPOSITORY_OWNER}",
            "targetAbi": "12.0.0.0",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "version": "${VERSION}",
            "status": "Active",
            "autoUpdate": false
          }
          EOF
          
          # 5. Sanity check deployment metadata structural parsing integrity
          python3 -c "import json,sys; json.load(open('$PKG/meta.json')) or sys.exit(0)"
          
          # 6. Compress staging output workspace into clean install target
          (cd "$PKG" && zip -r "../${PKG}.zip" .)
          echo "PKG=${PKG}" >> "$GITHUB_ENV"
          ls -la "$PKG" "${PKG}.zip"

      - name: Keep the zip as a build result
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG }}
          path: ${{ env.PKG }}.zip

      - name: Publish a release (only when you push a tag like v1.0.0)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" "${PKG}.zip" --title "$GITHUB_REF_NAME" --generate-notes
