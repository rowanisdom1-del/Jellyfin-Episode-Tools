name: Build plugin

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Install the .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Find the project (works wherever the folders were uploaded)
        run: |
          set -euo pipefail
          CSPROJ=$(find . -name Jellyfin.Plugin.EpisodeTools.csproj | awk '{print length, $0}' | sort -n | head -1 | cut -d' ' -f2-)
          LOGO=$(find . -path '*assets/logo.png' | awk '{print length, $0}' | sort -n | head -1 | cut -d' ' -f2- || true)
          echo "Project: $CSPROJ"
          echo "Logo: ${LOGO:-none}"
          echo "CSPROJ=$CSPROJ" >> "$GITHUB_ENV"
          echo "LOGO=${LOGO:-}" >> "$GITHUB_ENV"

      - name: Build
        run: dotnet build "$CSPROJ" -c Release -o out

      - name: Package (DLL + meta.json in a zip)
        run: |
          set -euo pipefail
          VERSION=$(grep -oP '(?<=<Version>)[^<]+' "$CSPROJ")
          PKG="EpisodeTools_${VERSION}"
          mkdir -p "$PKG"
          cp out/Jellyfin.Plugin.EpisodeTools.dll "$PKG/"
          if [ -n "$LOGO" ]; then cp "$LOGO" "$PKG/logo.png"; fi
          cat > "$PKG/meta.json" <<EOF
          {
            "category": "General",
            "changelog": "Version ${VERSION}",
            "description": "Scheduled tasks to rename episodes to Show - S01E02 - Title and to convert MKV to MP4 without quality loss.",
            "guid": "059e3874-fa20-4af9-af24-8d26823840d9",
            "name": "Episode Tools",
            "overview": "Rename episodes and convert MKV to MP4 from Scheduled Tasks",
            "owner": "${GITHUB_REPOSITORY_OWNER}",
            "targetAbi": "12.0.0.0",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "version": "${VERSION}",
            "status": "Active",
            "autoUpdate": false
          }
          EOF
          if [ -f "$PKG/logo.png" ]; then
            python3 -c "import json; p='$PKG/meta.json'; d=json.load(open(p)); d['imagePath']='logo.png'; json.dump(d, open(p,'w'), indent=2)"
          fi
          python3 -c "import json; json.load(open('$PKG/meta.json'))"
          (cd "$PKG" && zip -r "../${PKG}.zip" .)
          echo "PKG=${PKG}" >> "$GITHUB_ENV"
          ls -la "$PKG" "${PKG}.zip"

      - name: Keep the zip as a build result
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG }}
          path: ${{ env.PKG }}.zip

      - name: Publish a release (only when you push a tag like v1.0.0)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" "${PKG}.zip" --title "$GITHUB_REF_NAME" --generate-notes
