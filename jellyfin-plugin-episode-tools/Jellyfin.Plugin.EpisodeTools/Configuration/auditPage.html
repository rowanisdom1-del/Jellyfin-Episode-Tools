<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Episode Tools Audit</title>
</head>
<body>
<div id="EpisodeToolsAuditPage" data-role="page" class="page type-interior">
    <div data-role="content">
        <div class="content-primary">
<style>
        .epTools-nav {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 0 0 1.2em 0;
        }
        .epTools-nav a {
            padding: 8px 16px;
            border-radius: 6px;
            background: rgba(255,255,255,0.06);
            color: inherit;
            text-decoration: none;
            font-weight: 500;
        }
        .epTools-nav a.active {
            background: #00a4dc;
            color: #fff;
        }
        .epTools-nav a:hover {
            background: rgba(255,255,255,0.12);
        }
    </style>
            <div class="epTools-nav" id="epToolsNav"></div>
            <script type="text/javascript">
                (function () {
                    var pages = [
                        ['Settings', 'Episode Tools'],
                        ['Shows', 'Episode Tools Shows'],
                        ['Report', 'Episode Tools Report'],
                        ['Sub Check', 'Episode Tools Sub Check'],
                        ['Audit', 'Episode Tools Audit']
                    ];
                    var title = (document.title || '').toLowerCase();
                    var nav = document.getElementById('epToolsNav');
                    pages.forEach(function (p) {
                        var a = document.createElement('a');
                        a.textContent = p[0];
                        a.href = '#';
                        if (title === p[1].toLowerCase()) { a.className = 'active'; }
                        a.addEventListener('click', function (e) {
                            e.preventDefault();
                            Dashboard.navigate('configurationpage?name=' + encodeURIComponent(p[1]));
                        });
                        nav.appendChild(a);
                    });
                })();
            </script>
            <h2>Episode Tools — Library Audit</h2>
            <p>Result of the latest <b>7. Audit library</b> task: duplicate episodes (same show, season
            and episode in more than one file) and the largest video files — handy when space runs out.</p>
            <div style="margin-bottom:1em;">
                <input id="AuditFilter" type="text" is="emby-input" style="width:60%;" placeholder="Filter by show or file name…" />
            </div>
            <div id="AuditInfo" class="fieldDescription" style="margin-bottom:1em;"></div>

            <h3 style="margin-bottom:0.5em;">Duplicate episodes</h3>
            <div id="AuditDups" style="margin-bottom:1.5em;"></div>

            <h3 style="margin-bottom:0.5em;">Largest files</h3>
            <div id="AuditBig"></div>
        </div>
    </div>
    <script type="text/javascript">
        (function () {
            var allDups = [];  // {key, files:[{path,size}], el}

            function applyFilter() {
                var q = (document.querySelector('#AuditFilter').value || '').toLowerCase();
                allDups.forEach(function (g) {
                    var match = !q || g.key.toLowerCase().indexOf(q) !== -1 ||
                        g.files.some(function (f) { return f.path.toLowerCase().indexOf(q) !== -1; });
                    g.el.style.display = match ? '' : 'none';
                });
            }
            window.__auditApplyFilter = applyFilter;

            function resolve(key, action, groupEl) {
                ApiClient.ajax({
                    type: 'POST',
                    url: ApiClient.getUrl('EpisodeTools/AuditAction'),
                    dataType: 'text',
                    data: JSON.stringify({ key: key, action: action }),
                    contentType: 'application/json'
                }).then(function (text) {
                    var res = JSON.parse(text || '{}');
                    var note = document.createElement('div');
                    note.className = 'fieldDescription';
                    note.style.marginLeft = '1em';
                    note.textContent = 'Resolved: kept ' + (res.kept || '').split('/').pop()
                        + (res.removed ? ', removed ' + res.removed.length + ' file(s)' : '')
                        + (res.errors && res.errors.length ? ', ' + res.errors.length + ' error(s)' : '')
                        + (res.trash ? ' (trash: ' + res.trash + ')' : '');
                    groupEl.appendChild(note);
                    groupEl.querySelectorAll('button, select').forEach(function (el) { el.disabled = true; });
                }).catch(function () {
                    alert('Resolving failed — see Dashboard > Logs.');
                });
            }
            function fmtSize(bytes) {
                var units = ['B', 'KB', 'MB', 'GB', 'TB'];
                var n = parseFloat(bytes) || 0, u = 0;
                while (n >= 1024 && u < units.length - 1) { n /= 1024; u++; }
                return (u === 0 ? Math.round(n) : n.toFixed(1)) + ' ' + units[u];
            }

            function render(lines) {
                var dups = {};
                var dupOrder = [];
                var big = [];
                var date = '', totalBytes = 0, totalFiles = 0;
                for (var i = 0; i < lines.length; i++) {
                    var cols = lines[i].split('\t');
                    if (cols[0] === 'RUN') { date = cols[2] || ''; continue; }
                    if (cols[0] === 'DUP') {
                        var key = cols[1] || '';
                        if (!dups[key]) { dups[key] = []; dupOrder.push(key); }
                        dups[key].push({ path: cols[2] || '', size: cols[3] || '0' });
                    } else if (cols[0] === 'BIG') {
                        big.push({ size: cols[1] || '0', path: cols[2] || '' });
                    } else if (cols[0] === 'TOTAL') {
                        totalBytes += parseFloat(cols[1]) || 0;
                        totalFiles++;
                    }
                }

                document.querySelector('#AuditInfo').textContent =
                    'Latest audit: ' + date.replace('T', ' ').replace('Z', ' UTC')
                    + ' — ' + dupOrder.length + ' duplicate episode group(s), ' + totalFiles + ' folder(s) scanned.';

                var dupDiv = document.querySelector('#AuditDups');
                dupDiv.innerHTML = '';
                allDups = [];
                if (dupOrder.length === 0) {
                    dupDiv.innerHTML = '<div class="fieldDescription">No duplicate episodes found — nice.</div>';
                } else {
                    dupOrder.forEach(function (key) {
                        var parts = key.split('|');
                        var head = document.createElement('div');
                        head.style.fontWeight = 'bold';
                        head.textContent = (parts[0] || '?') + ' S' + (parts[1] || '') + 'E' + (parts[2] || '') + ' — ' + dups[key].length + ' files';
                        dupDiv.appendChild(head);
                        dups[key].forEach(function (f) {
                            var row = document.createElement('div');
                            row.style.wordBreak = 'break-all';
                            row.style.marginLeft = '1em';
                            row.textContent = '• ' + fmtSize(f.size) + ' — ' + f.path;
                            dupDiv.appendChild(row);
                        });

                        var actions = document.createElement('div');
                        actions.style.marginLeft = '1em';
                        actions.style.marginBottom = '1em';
                        var sel = document.createElement('select');
                        sel.className = 'selectEpisodeTools';
                        [['keep-largest', 'Keep largest, archive others'], ['keep-newest', 'Keep newest, archive others'], ['delete-others', 'Keep largest, DELETE others']].forEach(function (o) {
                            var opt = document.createElement('option');
                            opt.value = o[0];
                            opt.textContent = o[1];
                            sel.appendChild(opt);
                        });
                        var go = document.createElement('button');
                        go.setAttribute('is', 'emby-button');
                        go.className = 'raised button-mini emby-button';
                        go.textContent = 'Resolve';
                        var groupEl = document.createElement('div');
                        groupEl.appendChild(sel);
                        groupEl.appendChild(go);
                        dupDiv.appendChild(groupEl);
                        go.addEventListener('click', function () {
                            if (sel.value === 'delete-others' && !confirm('Delete the smaller files permanently?')) return;
                            resolve(key, sel.value, groupEl);
                        });
                        allDups.push({ key: key, files: dups[key], el: groupEl });
                    });
                }

                var bigDiv = document.querySelector('#AuditBig');
                bigDiv.innerHTML = '';
                if (big.length === 0) {
                    bigDiv.innerHTML = '<div class="fieldDescription">Nothing found yet.</div>';
                } else {
                    big.forEach(function (f) {
                        var row = document.createElement('div');
                        row.style.wordBreak = 'break-all';
                        row.textContent = '• ' + fmtSize(f.size) + ' — ' + f.path;
                        bigDiv.appendChild(row);
                    });
                }
            }

            document.querySelector('#EpisodeToolsAuditPage')
                .addEventListener('pageshow', function () {
                    Dashboard.showLoadingMsg();
                    ApiClient.ajax({
                        type: 'GET',
                        url: ApiClient.getUrl('EpisodeTools/Audit'),
                        dataType: 'text'
                    }).then(function (text) {
                        allDups = [];
                        render((text || '').split(/\r?\n/));
                        if (window.__auditApplyFilter) { window.__auditApplyFilter(); }
                        Dashboard.hideLoadingMsg();
                    }).catch(function () {
                        document.querySelector('#AuditInfo').textContent = 'Could not load the audit. Is plugin v2.0.0+ installed?';
                        Dashboard.hideLoadingMsg();
                    });
                });
        })();
        document.addEventListener('input', function (e) {
            if (e.target && e.target.id === 'AuditFilter' && window.__auditApplyFilter) { window.__auditApplyFilter(); }
        });
    </script>
</div>
</body>
</html>
