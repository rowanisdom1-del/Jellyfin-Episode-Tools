<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1e1b4b" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="256" rx="112" fill="url(#shine)"/>
  <!-- film frame -->
  <g filter="url(#sh)">
    <rect x="96" y="96" width="320" height="224" rx="28" fill="#fff"/>
    <!-- sprocket holes -->
    <g fill="#7c3aed" fill-opacity=".85">
      <rect x="112" y="116" width="18" height="26" rx="6"/><rect x="112" y="165" width="18" height="26" rx="6"/>
      <rect x="112" y="214" width="18" height="26" rx="6"/><rect x="112" y="263" width="18" height="26" rx="6"/>
      <rect x="382" y="116" width="18" height="26" rx="6"/><rect x="382" y="165" width="18" height="26" rx="6"/>
      <rect x="382" y="214" width="18" height="26" rx="6"/><rect x="382" y="263" width="18" height="26" rx="6"/>
    </g>
    <!-- play -->
    <path d="M226 142 L226 274 Q226 288 238 281 L328 215 Q338 208 328 201 L238 135 Q226 128 226 142 Z" fill="url(#bg)" transform="translate(0,0)"/>
  </g>
  <!-- episode tag -->
  <g filter="url(#sh)">
    <rect x="136" y="346" width="240" height="84" rx="42" fill="#0f172a"/>
    <text x="256" y="402" text-anchor="middle" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-weight="700" font-size="42" fill="#fff" letter-spacing="2">S01E02</text>
  </g>
</svg>
